name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-sphere ./cmd/pocket-sphere
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/psp DEMO_DATA=true AUTH_MODE=none ./pocket-sphere &
          sleep 3
          curl -fsS http://localhost:8080/healthz
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/v1/dashboard | grep -q '"scenes":36' && break; sleep 1; done
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q '"scenes":36'
          curl -fsS "http://localhost:8080/api/v1/scenes?per=5&vr=yes" | grep -q '"projection":"equirect180"'
          curl -fsS http://localhost:8080/api/v1/home | grep -q '"continue"'
          curl -fsS http://localhost:8080/api/v1/performers | grep -q '"Mila Hart"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-sphere:pr
