# Pocket Sphere — a video library with a VR player (Go + SQLite):
# scenes, performers, studios, tags, markers, hover previews, fingerprints
# and lookups, downloads from links (yt-dlp), DeoVR/HereSphere feeds.
# One container, two volumes: the app's data and the video library.
services:
  pocket-sphere:
    image: ghcr.io/abjelosevic88/pocket-homelab-sphere:latest
    container_name: pocket-sphere
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Pushes (Apprise / ntfy / JSON webhook); everyone can set their own under Settings → Notifications.
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Convert on an Intel/AMD GPU (also uncomment devices + group_add below):
      # HWACCEL: vaapi
      # Pocket Core: one sign-in, Pocket AI and events for the other Pocket apps.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      # Your videos (any folders). Downloads from links land here too, so keep it writable.
      - ./library:/library
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "991"   # the host's "render" group: stat -c %g /dev/dri/renderD128
    extra_hosts:
      - "host.docker.internal:host-gateway"
